<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="canopyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Shield Background -->
  <rect width="512" height="512" rx="128" fill="#0b0f19"/>
  
  <!-- Canopy Roof Peak Triangles -->
  <g filter="url(#glow)">
    <!-- Main Center Roof Peak -->
    <polygon points="256,70 90,260 256,290" fill="url(#accentGrad)" opacity="0.95"/>
    <polygon points="256,70 422,260 256,290" fill="url(#canopyGrad)"/>
    
    <!-- Left & Right Slope Highlights -->
    <polygon points="256,70 90,260 173,310 256,290" fill="#38bdf8" opacity="0.4"/>
    
    <!-- Valance Front Overhang Banner -->
    <polygon points="90,260 256,290 422,260 422,310 256,340 90,310" fill="url(#canopyGrad)"/>
    
    <!-- Frame Legs -->
    <rect x="100" y="310" width="22" height="150" rx="6" fill="#94a3b8"/>
    <rect x="390" y="310" width="22" height="150" rx="6" fill="#94a3b8"/>
    <rect x="245" y="340" width="22" height="120" rx="6" fill="#64748b"/>
  </g>
</svg>
